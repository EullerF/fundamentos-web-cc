<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo formulário HTML</title>
</head>

<body>
    <header>
        <h3>Formulários e Inputs</h3>
    </header>
    <main>
        <form id="registerForm" method="POST">
            <label for="nome"> Nome completo: </label>
            <input type="text" id="nome" name="nome" required />
            <br>
            <label for="email">Endereço de e-mail:</label>
            <input type="email" id="email" name="email" />
            <br>
            <label for="senha">Informe sua senha:</label>
            <input 
            type="password" 
            id="senha" 
            name="senha" 
            required 
            minlength="8"
            title="A senha deve ter no minimo 8 caracteres" 
            />
            <br>

            <label for="mensagem">Informe sua mensagem:</label>
            <br>
            <textarea id="mensagem" name="mensagem" rows="4" cols="30"></textarea>
            <br>
            <label for="evento">Selecione o evento escolhido:</label>
            <!-- Tag de seletor, ao selecionar uma das opções o value da option é atribuido ao name do select -->
            <!-- key:value -->
            <!-- evento:teatro -->
            <select id="evento" name="evento">
                <option value="rock">Show de Rock</option>
                <option value="modao">Show de Sertanejo</option>
                <option value="teatro">Teatro: Comédia</option>
            </select>
            <br>
            <!-- Input checkbox -> Opção de multipla escolha: -->
            <label for="termos">
                <input type="checkbox" id="termos" name="termos" required>
                Aceito os termos de uso
            </label>
            <br>
            <!-- Input type radio - Escolha única -->
            <label><input type="radio" name="pagamento" value="pix" />Pix</label>
            <label><input type="radio" name="pagamento" value="cartao" />Cartão</label>
            <br>
            <input type="date" />
            <br>
            <input type="file" />
            <input 
            type="text" 
            id="cpf" 
            name="cpf" 
            placeholder="000.000.000-00"
            required
            pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
            title="Formato esperado: 000.000.000-00"
            />
            <!-- Para o type radio funcionar ambos os inputs devem compartilhas o mesmo name -->
            <br>
            <input type="submit" value="Cadastrar" />
            <button type="button" onclick="">Cancelar</button>
        </form>
    </main>
    <footer>
        <p>Desenvolvido por Euller</p>
    </footer>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function (event) {
            event.preventDefault(); // impede o comportamento padrão de envio do formulário (recarregamento)
            const nome = document.getElementById('nome').value;
            alert('Ola,' + nome + ' cadastro enviado com sucesso');
        })
    </script>

</body>

</html>
